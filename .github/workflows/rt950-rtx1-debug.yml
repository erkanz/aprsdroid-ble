name: RT950 RTX1 Debug Build

on:
  push:
    branches:
      - feature/ble-kiss
    paths:
      - ".github/workflows/rt950-rtx1-debug.yml"
      - "tools/apply_rt950_cold_boot_init.py"
      - "tools/apply_rt950_rtx1_debug.py"
      - "src/backend/RadtelRtx1Codec.java"
      - "src/backend/BleKissProfileSpec.java"
      - "test/java/org/aprsdroid/app/RadtelRtx1CodecTest.java"
      - "test/java/org/aprsdroid/app/BleKissProfileSpecTest.java"
  workflow_dispatch:

concurrency:
  group: rt950-rtx1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-rtx1-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply RT950 cold-boot OEM initialization
        run: python3 tools/apply_rt950_cold_boot_init.py

      - name: Apply paired RT950 RTX1 transport patch
        run: python3 tools/apply_rt950_rtx1_debug.py

      - name: Verify expected RT950 source transformation
        shell: bash
        run: |
          set -euo pipefail
          grep -F '*** RT950 OEM INIT WRITE uuid=FF31' src/backend/BluetoothLETnc.scala
          grep -F '*** RT950 OEM INIT=PASS' src/backend/BluetoothLETnc.scala
          grep -F '*** RT950 RTX1 TX uuid=' src/backend/BluetoothLETnc.scala
          grep -F 'val NO_RESPONSE_PACE_MS = 5L' src/backend/BluetoothLETnc.scala
          grep -F 'RadtelRtx1Codec.encode(ax25)' src/backend/BluetoothLETnc.scala

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run BLE/RTX1 unit tests
        run: ./gradlew --stacktrace --warning-mode all testDebugUnitTest

      - name: Assemble paired RTX1 debug APK
        run: ./gradlew --stacktrace --warning-mode all assembleDebug

      - name: Upload paired RTX1 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aprsdroid-rt950-rtx1-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
